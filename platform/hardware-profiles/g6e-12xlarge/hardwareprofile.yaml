apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: g6e-12xlarge
  namespace: redhat-ods-applications
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    opendatahub.io/dashboard-feature-visibility: '["model-serving"]'
    opendatahub.io/disabled: 'false'
    opendatahub.io/display-name: 'AWS g6e.12xlarge (4x NVIDIA L40S)'
spec:
  identifiers:
    - defaultCount: 8
      displayName: CPU
      identifier: cpu
      maxCount: 46
      minCount: 4
      resourceType: CPU
    - defaultCount: 64Gi
      displayName: Memory
      identifier: memory
      maxCount: 384Gi
      minCount: 32Gi
      resourceType: Memory
    - defaultCount: 2
      displayName: NVIDIA L40S GPU
      identifier: nvidia.com/gpu
      maxCount: 4
      minCount: 1
      resourceType: Accelerator
  scheduling:
    node:
      nodeSelector:
        node.kubernetes.io/instance-type: g6e.12xlarge
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
    type: Node
