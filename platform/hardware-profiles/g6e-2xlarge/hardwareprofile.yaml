apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: g6e-2xlarge
  namespace: redhat-ods-applications
  annotations:
    opendatahub.io/dashboard-feature-visibility: '["model-serving"]'
    opendatahub.io/disabled: 'false'
    opendatahub.io/display-name: 'AWS g6e.2xlarge (NVIDIA L40S)'
spec:
  identifiers:
    - defaultCount: 4
      displayName: CPU
      identifier: cpu
      maxCount: 7
      minCount: 2
      resourceType: CPU
    - defaultCount: 32Gi
      displayName: Memory
      identifier: memory
      maxCount: 58Gi
      minCount: 24Gi
      resourceType: Memory
    - defaultCount: 1
      displayName: NVIDIA L40S GPU
      identifier: nvidia.com/gpu
      maxCount: 1
      minCount: 1
      resourceType: Accelerator
  scheduling:
    node:
      nodeSelector:
        node.kubernetes.io/instance-type: g6e.2xlarge
      tolerations:
        - effect: NoSchedule
          key: nvidia.com/gpu
          operator: Exists
    type: Node
