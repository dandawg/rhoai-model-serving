apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: demo

resources:
  # Shared base resources (namespace, serviceaccount, role)
  - ../../../base
  # Job-specific base (configmap, job)
  - ../base

# Same MinIO upload logic as granite-7b
# Patches similar to granite-7b/minio but for llama-3-8b job
patches:
  - target:
      kind: Job
      name: download-llama-3-8b
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command/2
        value: |
          set -e
          pip install --no-cache-dir huggingface_hub boto3
          
          if [ ! -f /secrets/huggingface/token ]; then
            echo "ERROR: HuggingFace token required"
            exit 1
          fi
          
          export HUGGING_FACE_HUB_TOKEN=$(cat /secrets/huggingface/token)
          
          python3 - <<EOF
          from huggingface_hub import snapshot_download
          import boto3, os
          from pathlib import Path
          
          model_id = os.environ['MODEL_ID']
          local_path = '/tmp/model'
          token = os.environ['HUGGING_FACE_HUB_TOKEN']
          
          print(f"Downloading {model_id}")
          snapshot_download(repo_id=model_id, local_dir=local_path, local_dir_use_symlinks=False, token=token)
          
          print("Uploading to MinIO...")
          s3 = boto3.client('s3', endpoint_url=f"http://{os.environ['MINIO_ENDPOINT']}", aws_access_key_id=os.environ['MINIO_ACCESS_KEY'], aws_secret_access_key=os.environ['MINIO_SECRET_KEY'])
          bucket = os.environ.get('MINIO_BUCKET', 'models')
          model_name = os.environ.get('MODEL_NAME')
          
          try:
              s3.head_bucket(Bucket=bucket)
          except:
              s3.create_bucket(Bucket=bucket)
          
          for fp in Path(local_path).rglob('*'):
              if fp.is_file():
                  key = f"{model_name}/{fp.relative_to(local_path)}"
                  s3.upload_file(str(fp), bucket, key)
          print("Complete!")
          EOF
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MINIO_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: endpoint
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: accessKey
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: minio-credentials
              key: secretKey
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MINIO_BUCKET
          value: "models"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: llama-3-8b-metadata
              key: model-name
