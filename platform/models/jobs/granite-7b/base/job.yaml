apiVersion: batch/v1
kind: Job
metadata:
  name: download-granite-7b
  namespace: demo
  labels:
    app.kubernetes.io/name: granite-7b-downloader
    app.kubernetes.io/part-of: rhoai-demos
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 3
  completions: 1
  parallelism: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: granite-7b-downloader
    spec:
      serviceAccountName: model-downloader
      restartPolicy: OnFailure
      containers:
        - name: downloader
          image: python:3.11-slim
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "Installing HuggingFace CLI..."
              pip install --no-cache-dir huggingface_hub
              
              echo "Model: ${MODEL_ID}"
              echo "Target: ${STORAGE_PATH}"
              
              # Check if token is provided
              if [ -f /secrets/huggingface/token ]; then
                echo "Using HuggingFace token for authentication"
                export HUGGING_FACE_HUB_TOKEN=$(cat /secrets/huggingface/token)
              else
                echo "No HuggingFace token found, downloading public model only"
              fi
              
              # Download model
              echo "Starting model download..."
              python3 - <<EOF
              from huggingface_hub import snapshot_download
              import os
              
              model_id = os.environ.get('MODEL_ID')
              storage_path = os.environ.get('STORAGE_PATH')
              token = os.environ.get('HUGGING_FACE_HUB_TOKEN', None)
              
              print(f"Downloading {model_id} to {storage_path}")
              snapshot_download(
                  repo_id=model_id,
                  local_dir=storage_path,
                  local_dir_use_symlinks=False,
                  token=token
              )
              print("Download completed successfully!")
              EOF
              
              echo "Verifying download..."
              ls -lah ${STORAGE_PATH}
              
              echo "Model download complete!"
          env:
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: granite-7b-metadata
                  key: model-id
            - name: STORAGE_PATH
              value: "/models/granite-7b-instruct"
          volumeMounts:
            - name: model-storage
              mountPath: /models
            - name: huggingface-token
              mountPath: /secrets/huggingface
              readOnly: true
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
      volumes:
        - name: model-storage
          # Will be overridden by variant (PVC or emptyDir for MinIO)
          emptyDir: {}
        - name: huggingface-token
          secret:
            secretName: huggingface-token
            optional: true
