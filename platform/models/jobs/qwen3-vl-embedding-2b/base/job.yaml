apiVersion: batch/v1
kind: Job
metadata:
  name: download-qwen3-vl-embedding-2b
  namespace: demo
  labels:
    app.kubernetes.io/name: qwen3-vl-embedding-2b
    app.kubernetes.io/part-of: rhoai-demos
    app.kubernetes.io/component: model-download
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qwen3-vl-embedding-2b
        app.kubernetes.io/component: model-download
    spec:
      serviceAccountName: model-downloader
      restartPolicy: OnFailure
      containers:
        - name: download
          image: registry.redhat.io/ubi9/python-311:9.7
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -c
            - |
              set -e
              echo "======================================"
              echo "Downloading Qwen3-VL-Embedding-2B model"
              echo "======================================"
              
              MODEL_ID="Qwen/Qwen3-VL-Embedding-2B"
              OUTPUT_DIR="/models-cache/Qwen3-VL-Embedding-2B"
              
              # Install huggingface-hub if not available
              pip install --quiet huggingface-hub
              
              # Download the model
              echo "Downloading from HuggingFace: ${MODEL_ID}"
              python3 -c "
              from huggingface_hub import snapshot_download
              import os
              
              model_id = '${MODEL_ID}'
              output_dir = '${OUTPUT_DIR}'
              
              print(f'Downloading {model_id} to {output_dir}...')
              snapshot_download(
                  repo_id=model_id,
                  local_dir=output_dir,
                  local_dir_use_symlinks=False,
                  resume_download=True
              )
              print('Download complete!')
              "
              
              echo "======================================"
              echo "Model downloaded successfully!"
              echo "Location: ${OUTPUT_DIR}"
              echo "======================================"
              
              # List downloaded files
              echo "Files downloaded:"
              ls -lh "${OUTPUT_DIR}"
              
              echo "Job completed successfully!"
          volumeMounts:
            - name: model-storage
              mountPath: /models-cache
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              cpu: "4"
              memory: 16Gi
      volumes:
        - name: model-storage
          persistentVolumeClaim:
            claimName: qwen3-vl-embedding-2b-model-storage
