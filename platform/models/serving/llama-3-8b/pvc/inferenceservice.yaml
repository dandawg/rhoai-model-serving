apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  annotations:
    serving.kserve.io/deploymentMode: RawDeployment
    serving.kserve.io/stop: 'false'
    openshift.io/description: 'Meta Llama 3 8B instruction model'
    openshift.io/display-name: llama-3-8b
    argocd.argoproj.io/sync-wave: "5"
  name: llama-3-8b
  namespace: demo
  finalizers:
    - inferenceservice.finalizers
    - odh.inferenceservice.finalizers
  labels:
    networking.kserve.io/visibility: exposed
    opendatahub.io/dashboard: 'true'
    opendatahub.io/genai-asset: 'true'
    app.kubernetes.io/name: llama-3-8b
    app.kubernetes.io/part-of: rhoai-demos
spec:
  predictor:
    automountServiceAccountToken: false
    maxReplicas: 1
    minReplicas: 1
    model:
      modelFormat:
        name: vLLM
      name: ''
      resources:
        limits:
          cpu: '2'
          memory: 20Gi
          nvidia.com/gpu: '1'
        requests:
          cpu: '2'
          memory: 20Gi
          nvidia.com/gpu: '1'
      runtime: llama-3-8b-runtime
      storageUri: pvc://llama-3-8b-model-storage/llama-3-8b-instruct
    nodeSelector:
      node.kubernetes.io/instance-type: g6.4xlarge
    tolerations:
      - effect: NoSchedule
        key: nvidia.com/gpu
        operator: Exists
