apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
    opendatahub.io/serving-runtime-scope: namespace
    opendatahub.io/template-display-name: OSS vLLM (Upstream) ServingRuntime for KServe
    opendatahub.io/template-name: oss-vllm-runtime-template
    openshift.io/display-name: OSS vLLM Latest Runtime
    openshift.io/description: 'Upstream vLLM runtime using docker.io/vllm/vllm-openai. Image tag is managed via kustomization.yaml images override.'
    argocd.argoproj.io/sync-wave: "14"
  name: oss-vllm-runtime
  namespace: demo
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  annotations:
    opendatahub.io/kserve-runtime: vllm
    prometheus.io/path: /metrics
    prometheus.io/port: '8080'
  containers:
    - args:
        - '--port=8080'
        - '--model=/mnt/models'
        - '--served-model-name={{.Name}}'
      command:
        - python3
        - '-m'
        - vllm.entrypoints.openai.api_server
      env:
        - name: HF_HOME
          value: /tmp/hf_home
        # OpenShift runs containers as a random non-root UID with no writable home dir.
        # Many libraries (Triton, FlashInfer, torch compile, etc.) resolve ~ to / and
        # then try to create cache dirs under /.cache or /.triton, which is read-only.
        # Setting HOME=/tmp makes ~ resolve to /tmp so all of those default paths work.
        - name: HOME
          value: /tmp
        # Explicit overrides for libraries that bypass HOME and use their own var.
        - name: TRITON_CACHE_DIR
          value: /tmp/triton
        - name: FLASHINFER_WORKSPACE_DIR
          value: /tmp/flashinfer
        # Reduces CUDA allocator fragmentation, which can cause OOM when the
        # allocator holds reserved-but-unallocated blocks it cannot reuse.
        - name: PYTORCH_ALLOC_CONF
          value: expandable_segments:True
      # Image tag is controlled by the `images` field in kustomization.yaml.
      # To pin to a specific build: set newTag to a nightly SHA, e.g.
      #   nightly-d106bf39f56cdc59d08a84094c0de41a0be9ad0f
      # Available tags: https://hub.docker.com/r/vllm/vllm-openai/tags
      image: 'docker.io/vllm/vllm-openai:nightly'
      name: kserve-container
      ports:
        - containerPort: 8080
          protocol: TCP
      startupProbe:
        httpGet:
          path: /health
          port: 8080
        initialDelaySeconds: 60
        periodSeconds: 30
        failureThreshold: 80
        timeoutSeconds: 10
      readinessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 30
        timeoutSeconds: 5
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /health
          port: 8080
        periodSeconds: 100
        timeoutSeconds: 5
        failureThreshold: 3
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
