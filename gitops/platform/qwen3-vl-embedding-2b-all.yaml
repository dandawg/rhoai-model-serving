apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-base-resources
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: model-base-resources
    app.kubernetes.io/part-of: rhoai-demos
    app.kubernetes.io/component: platform-models
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/dandawg/rhoai-model-serving.git
    targetRevision: main
    path: platform/models/base
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
---
