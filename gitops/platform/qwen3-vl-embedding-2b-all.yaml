apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-qwen3-vl-embedding-2b-pvc
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: qwen3-vl-embedding-2b-pvc
    app.kubernetes.io/part-of: rhoai-demos
    app.kubernetes.io/component: platform-models
spec:
  project: default
  source:
    repoURL: https://github.com/dandawg/rhoai-model-serving.git
    targetRevision: main
    path: platform/models/jobs/qwen3-vl-embedding-2b/base
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /status
    - group: "serving.kserve.io"
      kind: InferenceService
      jsonPointers:
        - /metadata/annotations
        - /metadata/labels
        - /spec
        - /status
---
