apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-qwen3-vl-8b-serving
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: qwen3-vl-8b-serving
    app.kubernetes.io/part-of: rhoai-demos
    app.kubernetes.io/component: platform-model-serving
spec:
  project: default
  source:
    repoURL: https://github.com/dandawg/rhoai-model-serving.git
    targetRevision: main
    path: platform/models/serving/qwen3-vl-8b/pvc
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    # Ignore model-specific configurations that may vary between deployments
    - group: serving.kserve.io
      kind: InferenceService
      jsonPointers:
        - /spec/predictor/model/args
        - /spec/predictor/model/resources
        - /spec/predictor/nodeSelector
        - /spec/predictor/tolerations
        - /spec/predictor/maxReplicas
        - /spec/predictor/minReplicas
        - /metadata/annotations
        - /metadata/labels
        - /status
    - group: serving.kserve.io
      kind: ServingRuntime
      jsonPointers:
        - /spec/containers/0/args
        - /spec/containers/0/image
        - /spec/containers/0/resources
        - /spec/containers/0/env
        - /metadata/annotations
        - /metadata/labels
        - /status
