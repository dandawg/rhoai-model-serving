apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-llama-3-8b-pvc
  namespace: openshift-gitops
  labels:
    app.kubernetes.io/name: llama-3-8b-pvc
    app.kubernetes.io/part-of: rhoai-demos
    app.kubernetes.io/component: platform-models
spec:
  project: default
  source:
    repoURL: https://github.com/dandawg/rhoai-model-serving.git
    targetRevision: main
    path: platform/models/jobs/llama-3-8b/pvc
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      jsonPointers:
        - /status